%YAML:1.0 # need to specify the file type at the top!

verbosity: "ALL" # ALL, DEBUG, INFO, WARNING, ERROR, SILENT

use_fej: true # if first-estimate Jacobians should be used (enable for good consistency)
integration: "rk4" # discrete, rk4, analytical (if rk4 or analytical used then analytical covariance propagation is used)
use_stereo: false # if we have more than 1 camera, if we should try to track stereo constraints between pairs
max_cameras: 2 # how many cameras we have 1 = mono, 2 = stereo, >2 = binocular (all mono tracking)

# ------------------------------------------------------------------
# Per-camera acquisition declaration (REQUIRED knowledge for async rigs)
# ------------------------------------------------------------------
# Declare what each physical camera IS. The estimator refuses a "rolling" camera without a
# positive readout time (silent 0 = unmodeled RS skew on every row), zeroes any stale readout
# on a "global" camera, and uses the nominal fps to seed the epoch-binding horizon and the
# ingest staleness gates from the first frame (fresh start AND every hard reset).
# The RS measurement model runs whenever the readout is nonzero -- calib_cam_readout below
# only controls whether the value is REFINED online.
#
# fpvhires rig (UNSYNCED dual-cam; the synced duo-AR0144 rig keeps VoxlConfig/fpv):
#   cam0 = IMX664 hires, ROLLING shutter, 60 fps nominal (epoch reference camera)
#   cam1 = AR0144 tracking, GLOBAL shutter, 30 fps nominal
# camN_fps must match the STREAMED sensor mode: it seeds the epoch-binding horizon and the
# ingest staleness gates, and it sanity-bounds the readout time (readout <= 1/fps).
cam0_shutter: "rolling"
cam0_readout_time_s: 0.001   # BRING-UP: RS deliberately UNMODELED (loud boot warning). The 15ms guess
                           # ran on hardware and its error aliased ~-4.3ms into cam0's dt (mean of the
                           # row-time error) while the row-dependent part helped walk the calibration
                           # off a cliff -- a WRONG readout is worse than none. Set the MEASURED value
                           # (active_rows x line_time of the streamed sensor mode; camx table
                           # line_length_pclk / vt_pix_clk) -- dt aliasing suggests ~3-6ms, NOT 12-15.
cam0_fps: 60.0
cam1_shutter: "global" # readout stays hard 0 and is NEVER estimated (no spurious DOF on the GS stream)
cam1_readout_time_s: 0.0
cam1_fps: 30.0

# --- BRING-UP CALIBRATION FREEZE -------------------------------------------------------------
# Hardware run 2026-07-04: with all four camera-calibration groups free and only 1-5 MSCKF
# features per update (SLAM starved), the calibration states random-walked: extrinsics moved
# 8-14cm, cam0 dt slid -4.3ms (readout-error aliasing), ba reached 0.45 m/s^2 -> triangulation
# died (retri 0/N), overlay features died young, filter diverged at ~0.5 m/s position drift.
# Freeze everything at kalibr until the pipeline soaks clean (retri N~M, SLAM map pinned ~30,
# stable dt/ba). Re-enable ONE group per soak, in this order:
#   1) measured cam0 readout (value only, calib still off)
#   2) calib_cam_timeoffset
#   3) calib_cam_readout (needs the measured seed; sigma below)
#   4) extrinsics/intrinsics last -- or leave frozen for production (factory cal is good)
calib_cam_extrinsics: true # BRING-UP freeze (was true): moved 8-14cm during the divergent run
calib_cam_intrinsics: true # BRING-UP freeze (was true)
calib_cam_timeoffset: true # BRING-UP freeze (was true): per-cam kalibr timeshift is trusted
calib_imu_intrinsics: false # if imu intrinsics should be calibrated (rotation and skew-scale matrix)
calib_imu_g_sensitivity: false # if gyroscope gravity sensitivity (Tg) should be calibrated

max_clones: 11 # how many clones in the sliding window
max_slam: 30 # number of features in our state vector
max_slam_in_update: 15 # update can be split into sequential updates of batches, how many in a batch
max_msckf_in_update: 20 # how many MSCKF features to use in the update
dt_slam_delay: 1 # delay before initializing (helps with stability from bad initialization...)

gravity_mag: 9.81 # magnitude of gravity in this location

feat_rep_msckf: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

# zero velocity update parameters we can use
# we support either IMU-based or disparity detection.
try_zupt: true
zupt_chi2_multipler: 1.0 # set to 0 for only disp-based
zupt_max_velocity: 0.03
zupt_noise_multiplier: 1
zupt_max_disparity: 8 # set to 0 for only imu-based
zupt_only_at_beginning: true
prop_window: 0.15
zupt_prop_window: 0.15

# ==================================================================
# ==================================================================

init_window_time: 2.0 # how many seconds to collect initialization information
init_imu_thresh: 1.0 # threshold for variance of the accelerometer to detect a "jerk" in motion
init_max_disparity: 20.0 # max disparity to consider the platform stationary (dependent on resolution)
init_max_features: 50 # how many features to track during initialization (saves on computation)

init_dyn_use: true # if dynamic initialization should be used
init_dyn_mle_opt_calib: false # if we should optimize calibration during intialization (not recommended)
init_dyn_mle_max_iter: 50 # how many iterations the MLE refinement should use (zero to skip the MLE)
init_dyn_mle_max_time: 0.05 # how many seconds the MLE should be completed in
init_dyn_mle_max_threads: 4 # how many threads the MLE should use
init_dyn_num_pose: 8 # number of poses to use within our window time (evenly spaced)
init_dyn_min_deg: 5.0 # orientation change needed to try to init

init_dyn_inflation_ori: 30 # what to inflate the recovered q_GtoI covariance by
init_dyn_inflation_vel: 150 # what to inflate the recovered v_IinG covariance by
init_dyn_inflation_bg: 10 # what to inflate the recovered bias_g covariance by
init_dyn_inflation_ba: 150 # what to inflate the recovered bias_a covariance by
init_dyn_min_rec_cond: 1e-12 # reciprocal condition number thresh for info inversion
init_warmstart_inject: true # seed the EKF with the init window's clones + their joint covariance so the filter updates immediately after a (re)init, instead of cold-starting a fresh ~2s window (set false to A/B against cold-start). Requires init_dyn_num_pose <= max_clones.

init_dyn_bias_g: [ 0.001, 0.001, 0.001 ] # initial gyroscope bias guess
init_dyn_bias_a: [ 0.001, 0.001, 0.001 ] # initial accelerometer bias guess
init_gravity_max_angle: 85.0  # Max tilt at init/reset (deg) for the DYNAMIC S2 path. Wide => reset at ANY attitude; the gram_schmidt argmin tangent basis + S2 gravity keep it well-conditioned. <90 acts as a flip guard.
init_static_gravity_max_angle: 5.0  # Tilt gate (deg) for the STATIC initializer ONLY. Kept TIGHT while the dynamic gate stays wide: static init assumes a near-level stationary platform, so a pitched/held drone must fall through to dynamic init instead of getting a bogus confident static seed. <0 => reuse init_gravity_max_angle (legacy coupled).
init_dyn_grav_prior_sigma: 0.5  # Weak +Z gravity prior (m/s^2 ~ deg) for the dynamic S2 init. Fixes flip rejection (42->49/50 in the NEES gold standard) at negligible accuracy cost. <=0 disables.
init_dyn_grav_gate_deg: 30.0  # Post-solve reject if the optimized gravity ends up > this many deg from +Z (flip/corruption guard before injection).
init_dyn_mle_lm_min_lambda: 1.0e-12 # zbft LM lambda floor. 1e-12 = Ceres-exact. The free-S2 solve pays ~9-12 rejected trials climbing lambda back up the gravity/accel-bias valley; raising the floor (e.g. 1e-7) trims that at some convergence-flag risk (bench_zbft_s2 fpv shape: 100/100 -> 84-97/100). A/B on target before changing.
init_dyn_mle_lm_nu_growth: 2.0 # zbft LM rejected-trial escalation growth. 2.0 = Ceres-exact; larger (e.g. 4.0) climbs the valley wall in fewer rejected trials, same caveat as above.
init_dyn_mle_lm_initial_lambda: 1.0e-4 # zbft LM initial damping. 1e-4 = Ceres-exact (initial_trust_region_radius 1e4). ORB-SLAM3's inertial-only MAP starts heavily damped (1e3) to keep early steps short/gradient-like in the gravity/bias valley -- candidate for on-target A/B.
init_dyn_reset_prior_use: true # SOFT-RESET bias prior: seed the re-init with the live filter's bg/ba (+ tightened per-axis first-pose bias prior) captured by soft_reset. The main conditioner of the gravity/accel-bias valley on re-init. Cold boot unaffected; a rejected prior degrades to the config seeds below.
init_dyn_reset_prior_max_bg: 0.2 # reject the snapshot if |bg| exceeds this (rad/s)
init_dyn_reset_prior_max_ba: 1.0 # reject the snapshot if |ba| exceeds this (m/s^2)
init_dyn_reset_prior_max_sigma_bg: 0.05 # reject if any bg sigma (after random-walk age inflation) exceeds this
init_dyn_reset_prior_max_sigma_ba: 0.5 # reject if any ba sigma (after random-walk age inflation) exceeds this
init_dyn_reset_prior_sigma_floor_bg: 0.005 # floor on the tightened bg prior sigma (protects MLE conditioning)
init_dyn_reset_prior_sigma_floor_ba: 0.02 # floor on the tightened ba prior sigma
init_dyn_reset_prior_divergence_infl: 3.0 # sigma inflation when the soft reset fired with health errors pending (divergence-suspected)
init_dyn_fix_ba_on_reset: false # hard-freeze ba during a reset re-init ("biases known" mode); injected ba covariance = floored prior variance. Requires an accepted prior; tightened-prior mode (false) is the safe default.
init_dyn_mle_ftol: 1.0e-6 # MLE relative-cost-decrease termination (legacy 1e-5; Ceres default is 1e-6 -- tighten if the injected tilt looks systematically lazy on weak-excitation windows)
# ==================================================================
# ==================================================================

record_timing_information: false # if we want to record timing information of the method
record_timing_filepath: "/tmp/traj_timing.txt" # https://docs.openvins.com/eval-timing.html#eval-ov-timing-flame

# if we want to save the simulation state and its diagional covariance
# use this with rosrun ov_eval error_simulation
save_total_state: false
filepath_est: "/tmp/ov_estimate.txt"
filepath_std: "/tmp/ov_estimate_std.txt"
filepath_gt: "/tmp/ov_groundtruth.txt"

# ==================================================================
# ==================================================================

# our front-end feature tracking parameters
# we have a KLT and descriptor based (KLT is better implemented...)
use_klt: true # if true we will use KLT, otherwise use a ORB descriptor + robust matching
use_gpu: true
num_pts: 50 # number of points (per camera) we will extract and try to track
fast_threshold: 15 # threshold for fast extraction (warning: lower threshs can be expensive)
grid_x: 5 # extraction sub-grid count for horizontal direction (uniform tracking)
grid_y: 5 # extraction sub-grid count for vertical direction (uniform tracking)
min_px_dist: 50 # distance between features (features near each other provide less information)
knn_ratio: 0.70 # descriptor knn threshold for the top two descriptor matches
track_frequency: 30.0 # NOT ENFORCED by the VOXL server (only the ROS wrappers throttle with this):
                      # every camera frame is tracked at its native rate (60+30 here), which is what
                      # epoch-anchored cloning wants -- regular reference-camera cadence, no aliasing drops
downsample_cameras: false # will downsample image in half if true
num_opencv_threads: 4 # -1: auto, 0-1: serial, >1: number of threads
histogram_method: "HISTOGRAM" # NONE, HISTOGRAM, CLAHE


fi_min_dist: 0.1
fi_max_dist: 60
fi_max_baseline: 200
fi_refine_features: true # if we should refine the features after tracking
fi_max_runs: 5 # how many times to refine the features
# aruco tag tracker for the system
# DICT_6X6_1000 from https://chev.me/arucogen/
use_aruco: false
num_aruco: 1024
downsize_aruco: true

# ==================================================================
# ==================================================================

# camera noises and chi-squared threshold multipliers
up_msckf_sigma_px: 1.2
up_msckf_chi2_multipler: 5.0 # was 20.0 -- far too permissive: systematically-biased rows (wrong RS
                             # readout, drifted calib) passed the gate and dragged the calibration
                             # states (the divergent-run mechanism). The synced-rig heritage value
                             # was 3.0; 5.0 is the bring-up compromise while RS is unmodeled.
up_slam_sigma_px: 1.2
up_slam_chi2_multipler: 5.0
up_aruco_sigma_px: 1.0
up_aruco_chi2_multipler: 3.5

# masks for our images
use_mask: false


# imu and camera spacial-temporal
# imu config should also have the correct noise values
relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"

# ==================================================================
# Asynchronous (unsynced) multi-camera support
# ==================================================================
# Epoch-anchored cloning: clones only at the REFERENCE camera's frame times; other cameras'
# frames snap onto the epoch clone via an exact ACI2 preintegration bridge over their known
# time residual. Restores the full clone-window baseline for unsynced dual-mono rigs and
# lets each camera's cam-IMU time offset be estimated individually (timeshift_cam_imu is
# now read for EVERY camera from the kalibr chain).
epoch_mode: true
# The reference camera MUST be the FASTEST camera (cam0 @ 60fps here). The binding horizon is
# ref_period x epoch_bind_factor; a slower reference (e.g. cam1 @ 30fps) makes the faster camera
# deliver >1 frame per epoch, and every extra frame hits the one-frame-per-(camera,epoch) rule
# and FALLS BACK to its own clone: the window fragments into mixed epoch/fallback times, the fast
# camera's tracks split across them, max-track/SLAM graduation dies, and updates starve
# (hardware run 2026-07-04 with ref=1: 1-5 MSCKF feats/update -> calibration random-walk).
cam_imu_dt_ref_camid: 0
epoch_bind_factor: 1.5
epoch_bridge_bias_cols: true # BRING-UP escape hatch (was true): with ANY timing/RS mismodeling the
                              # analytic bridge bias columns let camera residuals drive the IMU biases
                              # (ba hit 0.45 m/s^2 in the divergent run). 
                              # CAN TRY FALSE OR TRUE
# Rolling-shutter readout ONLINE CALIBRATION. The readout VALUE comes from the per-camera
# declaration block at the top (camN_shutter / camN_readout_time_s; kalibr t_readout is the
# fallback); this flag only controls whether it is REFINED in-state. Refinement applies ONLY
# to declared-rolling cameras (cam0 here); global-shutter cameras stay pinned at 0. The
# init sigma below must admit the seed error: 1ms suits a measured readout, 5ms a datasheet
# guess. dt_calib_gate freezes the column in degenerate motion (hover/constant velocity).
calib_cam_readout: true # BRING-UP freeze (stage 3): enable only after cam0_readout_time_s holds a
                         # MEASURED seed and the frozen-calib soak is clean. Refinement applies only
                         # to declared-rolling cameras (cam0); the GS cam is never estimated.
calib_cam_readout_init_sigma: 0.005
# Temporal-calibration observability gate (freeze dt/readout columns while hovering/static) WOULD LEAVE THIS AS FALSE... 
dt_calib_gate: false
dt_calib_gate_min_omega: 0.10
dt_calib_gate_min_vel_spread: 0.10
# Lock-free ingest (per-camera rings inside the estimator; release ordered against IMU time)
async_ring_size: 16
async_guard: 0.002
async_stale_factor: 1.5





